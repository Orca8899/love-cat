<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เว็บลับ 💕</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;overflow:hidden;background:linear-gradient(135deg,#ffd8e8,#eadcff,#d9f2ff)}.bg{position:fixed;inset:0;pointer-events:none}.bg span{position:absolute;font-size:25px;animation:f 7s linear infinite;opacity:.7}@keyframes f{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}.card{width:min(92%,520px);padding:38px 28px;text-align:center;background:#ffffffcc;backdrop-filter:blur(15px);border:2px solid #fff;border-radius:32px;box-shadow:0 25px 70px #80507033}.cat{font-size:78px}h1{color:#794663;margin:8px 0}p{color:#705d69;font-size:18px}.hint{color:#a48b9a;margin:18px 0 8px}input{width:100%;padding:16px;border:2px solid #edc5d9;border-radius:16px;text-align:center;font-size:21px;outline:0}button{border:0;border-radius:16px;padding:14px 24px;margin:8px;font-size:18px;font-weight:700;cursor:pointer;transition:.2s}button:hover{transform:translateY(-3px)}.main{background:linear-gradient(135deg,#e987b4,#aa82d9);color:white}.yes{background:#ff82ac;color:white}.no{background:#eee0e7;color:#72596a}.hidden{display:none}.msg{min-height:60px;margin-top:15px;font-size:21px;font-weight:800;color:#7d4562}.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}</style></head><body><div class="bg"><span style="left:8%;animation-delay:0s">💗</span><span style="left:25%;animation-delay:2s">✨</span><span style="left:48%;animation-delay:1s">💕</span><span style="left:70%;animation-delay:3s">🌸</span><span style="left:88%;animation-delay:1.5s">💖</span></div><main class="card" id="card"><section id="lock"><div class="cat">🐱🔐</div><h1>เว็บลับของเรา 💕</h1><p>ใส่รหัสก่อนน้าาา</p><div class="hint">คำใบ้ XX/XX/XXXX</div><input id="code" maxlength="10" placeholder="XX/XX/XXXX" autocomplete="off"><br><button class="main" onclick="unlock()">🔓 เปิดเว็บ</button><div class="msg" id="err"></div></section><section id="q" class="hidden"><div class="cat">🥰💗</div><h1>มีคำถามมม...</h1><p style="font-size:27px;font-weight:800">เธอรักเค้ามั้ยย 💕</p><button class="yes" onclick="yes()">💗 รักก</button><button class="no" onclick="nope()">😾 ไม่รักกก</button><div class="msg" id="msg"></div></section></main><script>const code=document.getElementById('code');code.onkeydown=e=>{if(e.key==='Enter')unlock()};function unlock(){if(code.value.trim()==='07/09/2026'){lock.classList.add('hidden');q.classList.remove('hidden')}else{err.textContent='รหัสไม่ถูกต้องน้าา 😿';card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')}}function nope(){msg.innerHTML='😾💢 เค้าจะงอนแล้ววว!!<br>🐱💢 ฮึ่มมม!!'}function yes(){msg.innerHTML='🥰💗 เย้ๆๆๆ ดีใจที่สุดดด!!<br>✨🐱✨'}</script></body></html>
